<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Kauê Souza — Portfólio de desenvolvedor full stack">
  <title>Kauê Souza — Portfólio de desenvolvedor full stack</title>
  <defs>
